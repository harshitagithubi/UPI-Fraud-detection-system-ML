
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Transaction</title>
</head>

<body>

    <h1>Edit Transaction</h1>

    <form method="POST">

        <label>Transaction Hour:</label>
        <input type="number" name="trans_hour"
               min="0" max="23" value="{{ record[1] }}" required>
        <br><br>

        <label>Transaction Day:</label>
        <input type="number" name="trans_day"
               min="1" max="31" value="{{ record[2] }}" required>
        <br><br>

        <label>Transaction Month:</label>
        <input type="number" name="trans_month"
               min="1" max="12" value="{{ record[3] }}" required>
        <br><br>

        <label>Transaction Amount:</label>
        <input type="number" step="0.01" min="0.01"
               name="trans_amount" value="{{ record[4] }}" required>
        <br><br>

        <label>Age:</label>
        <input type="number" name="age"
               min="14" max="94" value="{{ record[5] }}" required>
        <br><br>

        <label>Category:</label>
        <input type="number" name="category"
               min="0" max="13" value="{{ record[6] }}" required>
        <br><br>

        <label>State:</label>
        <input type="number" name="state"
               min="0" max="50" value="{{ record[7] }}" required>
        <br><br>

        <input type="submit" value="Update">

    </form>

    <br>
    <a href="{{ url_for('history') }}">Back to History</a>

</body>
</html>
